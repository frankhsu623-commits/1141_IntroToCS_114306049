<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Personal Information</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      padding: 20px;
    }
    table {
      border-collapse: collapse;
      width: 80%;
      margin: auto;
      background: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    th, td {
      border: 1px solid #999;
      padding: 10px;
      vertical-align: top;
    }
    th {
      background-color: #e0f0ff;
      text-align: center;
      font-size: 1.2em;
    }
    input[type="text"], input[type="email"], select, textarea {
      width: 90%;
      padding: 5px;
      border-radius: 5px;
      border: 1px solid #aaa;
    }
    textarea {
      height: 80px;
    }
    .photo-cell {
      text-align: center;
      width: 200px;
    }
    img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-bottom: 5px;
    }
    h1 {
      text-align: center;
    }
  </style>
</head>
<body>


  <form>
    <table>
      <!-- 標題 -->
      <tr>
        <th colspan="2">About 114306049</th>
      </tr>

      <!-- 照片 + Name/Gender -->
      <tr>
        <td rowspan="3" class="photo-cell">
          <img src="your-photo.jpg" alt="Personal Photo"><br>
          <strong>Personal Photo</strong>
        </td>
        <td>
          Name: <input type="text" name="name"><br><br>
          Gender:
          <label><input type="radio" name="gender" value="Male"> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Other"> Other</label>
        </td>
      </tr>

      <!-- County + Birthday -->
      <tr>
        <td>
          County:
          <select name="county">
            <option value="Taipei">Taipei</option>
            <option value="Tainan">Tainan</option>
            <option value="Taichung">Taichung</option>
            <option value="Taoyuan">Taoyuan</option>
          </select><br><br>
          Birthday: <input type="date" name="birthday">
        </td>
      </tr>

      <!-- Email -->
      <tr>
        <td>
          E-mail: <input type="email" name="email" placeholder="example@email.com">
        </td>
      </tr>

      <!-- Hobby -->
      <tr>
        <td><strong>Hobby:</strong></td>
        <td>
          <label><input type="checkbox" name="hobby" value="Swimming"> Swimming</label>
          <label><input type="checkbox" name="hobby" value="Volleyball"> Volleyball</label>
          <label><input type="checkbox" name="hobby" value="Movie"> Movie</label>
          <label><input type="checkbox" name="hobby" value="Game"> Game</label>
          <label><input type="checkbox" name="hobby" value="Sleep"> Sleep</label>
        </td>
      </tr>

      <!-- Skill -->
      <tr>
        <td><strong>Skill:</strong></td>
        <td>
          <label><input type="checkbox" name="skill" value="Java"> Java</label>
          <label><input type="checkbox" name="skill" value="HTML"> HTML</label>
          <label><input type="checkbox" name="skill" value="Python"> Python</label>
          <label><input type="checkbox" name="skill" value="Microsoft Office"> Microsoft Office</label>
          <label><input type="checkbox" name="skill" value="Premiere"> Premiere</label>
        </td>
      </tr>

      <!-- Say something -->
      <tr>
        <td><strong>Say something:</strong></td>
        <td>
          <textarea name="message" placeholder="Say something here."></textarea>
        </td>
      </tr>
    </table>
  </form>

</body>
</html>
